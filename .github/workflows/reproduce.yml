name: Reproduce experiment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  experiment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_experiment.py --dataset both --stage all
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: wine-scaling-analysis
          path: |
            results/
            figures/
            reports/
